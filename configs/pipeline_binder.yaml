# PPIFlow Pipeline Config – Binder Design
# Run with: python pipeline.py --config configs/pipeline_binder.yaml --output /path/to/out --num_samples 5
#
# De novo protein binder design against a target chain.
# Provide either input_pdb OR input_csv (not both).

task: binder

# ── Input (pick one) ─────────────────────────────────────────────────────────
input_pdb: ./TREM2_C_renum.pdb
# input_csv: /path/to/preprocessed_input.csv   # alternative to input_pdb

# ── Chains ───────────────────────────────────────────────────────────────────
target_chain: C
binder_chain: A         # required when specified_hotspots is null

# ── Hotspots (optional) ──────────────────────────────────────────────────────
# If omitted, hotspots are auto-detected from the binder interface.
specified_hotspots: "C31,C63,C78"
# sample_hotspot_rate_min: 0.2   # only used when specified_hotspots is null
# sample_hotspot_rate_max: 0.5

# ── Sampling ─────────────────────────────────────────────────────────────────
samples_min_length: 75
samples_max_length: 100

# ── Model ────────────────────────────────────────────────────────────────────
config: /home/seanwang/PPIFlow_sjw44/configs/inference_binder.yaml
model_weights: /home/seanwang/PPIFlow_sjw44/weights/binder.ckpt

# ── ProteinMPNN (inverse folding) ────────────────────────────────────────────
# Leave mpnn_weights unset (or remove the key) to skip inverse folding.
# mpnn_weights: /path/to/ProteinMPNN/model_weights
# model_name: v_48_020
# num_seqs_per_target: 8
# batch_size: 1
# sampling_temp: "0.1"
# mpnn_omit_AAs: "X"

# ── FAMPNN sidechain packing ──────────────────────────────────────────────────
# fampnn_weights: /path/to/fampnn/weights/fampnn_0_3.pt

# ── AF3Score (structure-based scoring) ───────────────────────────────────────
# Leave af3score_dir unset (or remove the key) to skip AF3Score.
# Install af3score first: pip install -e /path/to/af3score
# af3score_dir: /path/to/af3score          # repo root (contains af3score_pipeline.py)
# af3score_weights: /path/to/af3/weights/af3.bin   # AlphaFold3 model weights
# af3score_python: /path/to/af3score_venv/bin/python  # optional: separate venv
# af3score_num_workers: 4
# af3score_db_dir: /path/to/af3/databases

# ── Run identity ─────────────────────────────────────────────────────────────
# output_dir and num_samples are passed via --output and --num_samples CLI flags
name: IL7Ra
